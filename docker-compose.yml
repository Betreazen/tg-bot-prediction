# Project name isolates this stack from other bots on the same host:
# the network, volume and default resource names are all prefixed with it.
# Override with COMPOSE_PROJECT_NAME in .env if you run several copies.
name: ${COMPOSE_PROJECT_NAME:-tg-bot-prediction}

services:
  bot:
    build: .
    container_name: ${COMPOSE_PROJECT_NAME:-tg-bot-prediction}-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # The bot reaches Postgres over the private compose network, not the host.
      - DB_HOST=postgres
      - DB_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy
    # Apply migrations (single source of schema truth) before starting the bot.
    command: sh -c "alembic upgrade head && python -m bot.main"

  postgres:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-tg-bot-prediction}-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-prediction_bot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRES_DB: ${DB_NAME:-prediction_bot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-prediction_bot} -d ${DB_NAME:-prediction_bot}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # No host port is published on purpose: nothing outside the compose network
    # needs Postgres, so this never collides with other bots' databases.
    # To connect from the host for debugging, uncomment and pick a free port:
    # ports:
    #   - "${DB_HOST_PORT:-5433}:5432"

# Named with the project prefix automatically (e.g. tg-bot-prediction_postgres_data),
# so each bot keeps its own isolated data volume.
volumes:
  postgres_data:
